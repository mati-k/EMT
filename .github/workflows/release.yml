name: Release

# Pushing a tag like v2.0.0 builds all platforms and publishes a GitHub release with the zips.
# Running it manually only builds the zips, they can be downloaded from the run's artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Publish
        run: dotnet publish EMT.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o publish/${{ matrix.rid }}

      # zip keeps the executable flag Linux and macOS need
      - name: Zip
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "$GITHUB_WORKSPACE/EMT-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: EMT-${{ matrix.rid }}
          path: EMT-${{ matrix.rid }}.zip

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
